spring.application.name=mutual-fund-platform

# Server
server.port=8080

# MySQL Database Configuration
# Update the following settings if your local MySQL setup is different
spring.datasource.url=jdbc:mysql://localhost:3306/mutualfunddb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Hibernate/JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# 'update' will automatically create/update your tables based on the Java entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=MutualFundPlatformSecretKey2024VeryLongSecretKeyForJWTTokenGeneration1234567890
jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
